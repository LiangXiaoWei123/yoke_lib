name: Upload Yoke Component

on:
  push:
    tags:
      - "yoke-v*"

permissions:
  contents: read
  id-token: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload component to ESP Component Registry
        uses: espressif/upload-components-ci-action@v2
        with:
          components: "yoke: components/yoke"
          namespace: "LiangXiaoWei123"
